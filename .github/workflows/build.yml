name: Build

# This fork (latonita/Dashwheelos, on the last GPLv3 upstream 1251898a).
#  - push to an oss/** branch or a pull request: unit tests only.
#  - push a dated tag (v2026.11.06, or v2026.11.06.2 for a second one that day):
#    tests, then the launcher3 APK is built and published as a release named
#    after the date. The in-app updater reads these releases (UpdateManager):
#    the version code is the tag's date, 2026110600 + n, so it only ever grows.
# The APK is the githubDebug build with applicationId com.android.launcher3
# (survives XYAuto units' sleep), signed with the key in DEBUG_KEYSTORE_BASE64:
# the same key as local builds, so a release installs over a local build and
# the other way round (adb install -r -d for that direction: lower version code).
on:
  push:
    branches: [ 'oss/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      # The committed wrapper pins Gradle with a verified checksum; don't regenerate it.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Unit tests
        run: ./gradlew :unitproto:test :app:testGithubDebugUnitTest --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            unitproto/build/reports/tests/
          if-no-files-found: ignore

  release:
    name: Build and release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Work out the version from the tag
        run: |
          tag="$GITHUB_REF_NAME"
          if ! echo "$tag" | grep -Eq '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]{1,2})?$'; then
            echo "::error::Tag $tag is not a date tag like v2026.11.06 or v2026.11.06.2"; exit 1
          fi
          IFS=. read -r y m d n <<< "${tag#v}"
          code=$(( 10#$y$m$d * 100 + 10#${n:-0} ))
          date="$y-$m-$d${n:+ #$n}"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${tag#v}" >> "$GITHUB_ENV"
          echo "RELEASE_DATE=$date" >> "$GITHUB_ENV"
          echo "Version ${tag#v}, code $code"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # A random key per run would make every release a different app to Android:
      # no update in place, by hand or by the in-app updater.
      - name: Signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::No DEBUG_KEYSTORE_BASE64 secret: the APK could never update in place."; exit 1
          fi
          mkdir -p "$HOME/.android"
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"

      - name: Build the launcher3 APK
        run: ./gradlew :app:assembleGithubDebug -PdashApplicationId=com.android.launcher3 --stacktrace

      - name: Name the APK
        run: |
          apk="Dashwheel-launcher3-$VERSION_NAME.apk"
          cp app/build/outputs/apk/github/debug/app-github-debug.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9][0-9][0-9][0-9].*' HEAD^ 2>/dev/null || true)
          {
            echo "Dashwheel for Android 8.1 / GLES 2.0 head units, built from \`${GITHUB_SHA::8}\` (branch \`oss/radio\`)."
            echo
            echo "Install: \`adb install -r $APK\`, then set it as home: see"
            echo "[xyauto-9320-headunit](https://github.com/latonita/xyauto-9320-headunit/blob/main/docs/03-dashwheel.md)."
            echo "Package \`com.android.launcher3\`, version code $VERSION_CODE. sha256 in \`$APK.sha256\`."
            echo
            echo "## Changes${prev:+ since $prev}"
            echo
            git log ${prev:+$prev..}HEAD --no-merges -n 60 --format='- %s'
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Dashwheel ${{ env.RELEASE_DATE }}
          make_latest: true
          files: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
          body_path: ${{ runner.temp }}/notes.md
